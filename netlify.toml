# Netlify · Hulk Sports
# Sitio estático: no hay comando de build y se publica la raíz del repo tal cual.
[build]
  publish = "."

# Archivos internos del repo que no deben verse en el sitio publicado:
# notas y fuentes (content/), documentación, fotos originales sin optimizar,
# su índice y esta misma configuración. Netlify responde 404 en estas rutas.
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/fotos/fuente/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/fotos/fotos.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true
